[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/",
  "solmate/=lib/solmate/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]
